name: Stock Bot

on:
  schedule:
    # Daily scanner: 4:05 PM IST = 10:35 UTC
    - cron: "35 10 * * 1-5"

    # Intraday scanner
    # 9:15 AM IST = 3:45 UTC
    # 9:30 AM IST = 4:00 UTC
    # ...
    # 3:15 PM IST = 9:45 UTC
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"

  workflow_dispatch:
    inputs:
      scanner:
        description: "Which scanner to run"
        required: true
        default: "intraday"
        type: choice
        options:
          - intraday
          - daily

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily scanner
        if: |
          github.event.schedule == '35 10 * * 1-5' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.scanner == 'daily')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ALERT_MIN_SCORE: "70"
          MIN_PRICE: "50.0"
          MIN_AVG_DAILY_VOLUME: "200000"
          ALERT_DEDUP_HOURS: "4"

          EXECUTION_MODE: "dry_run"
          DATA_SOURCE: "yfinance"

          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "./bot"

        run: |
          python -m alerts.scanner

      - name: Run intraday scanner
        if: |
          github.event.schedule == '45 3 * * 1-5' ||
          github.event.schedule == '0,15,30,45 4-9 * * 1-5' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.scanner == 'intraday')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ALERT_MIN_SCORE: "70"
          MIN_PRICE: "50.0"
          MIN_AVG_DAILY_VOLUME: "200000"
          ALERT_DEDUP_HOURS: "4"

          EXECUTION_MODE: "dry_run"
          DATA_SOURCE: "yfinance"

          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "./bot"

        run: |
          python -m alerts.intraday_scanner --force