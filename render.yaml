# Render Infrastructure-as-Code Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

services:
  # Option A: Continuous Background Worker Daemon
  - type: worker
    name: india-swing-bot-daemon
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/scheduler.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_MIN_SCORE
        value: "70"
      - key: EXECUTION_MODE
        value: "live"
      - key: DATA_SOURCE
        value: "yahoo"
      - key: PYTHONUNBUFFERED
        value: "1"

  # Option B1: Render Cron Job - Daily Close Scanner (Runs Mon-Fri at 4:05 PM IST / 10:35 UTC)
  - type: cron
    name: swing-bot-daily-cron
    env: python
    schedule: "35 10 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alerts.scanner
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_MIN_SCORE
        value: "70"
      - key: EXECUTION_MODE
        value: "live"
      - key: DATA_SOURCE
        value: "yahoo"
      - key: PYTHONPATH
        value: "./bot"
      - key: PYTHONUNBUFFERED
        value: "1"

  # Option B2: Render Cron Job - Intraday Portfolio Scanner (Runs Mon-Fri every 15 mins during market hours)
  - type: cron
    name: swing-bot-intraday-cron
    env: python
    schedule: "0,15,30,45 4-9 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alerts.intraday_scanner
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_MIN_SCORE
        value: "70"
      - key: EXECUTION_MODE
        value: "live"
      - key: DATA_SOURCE
        value: "yahoo"
      - key: PYTHONPATH
        value: "./bot"
      - key: PYTHONUNBUFFERED
        value: "1"
